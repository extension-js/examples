<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Options Extension</title>
    <link rel="stylesheet" href="./styles.css" media="screen" />
  </head>
  <body>
    <header>
      <h1>
        <img class="logo" src="../images/icon.png" alt="Extension icon" width="72px" />
        <br />
        Welcome to your Options Extension
      </h1>
      <p>
        Learn more in the
        <a href="https://extension.js.org" target="_blank" rel="noopener noreferrer"
          >Extension.js docs</a
        >.
      </p>
    </header>
    <main>
      <p id="banner" class="banner" hidden>
        This banner is the setting below, saved and read back from storage.
      </p>
      <label class="setting" for="show-banner">
        <input type="checkbox" id="show-banner" />
        Show the welcome banner
      </label>
      <p id="status" class="status" role="status">Loading your setting...</p>
    </main>
  </body>
  <script src="./scripts.js"></script>
</html>
