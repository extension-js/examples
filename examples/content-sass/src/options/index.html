<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sass Content Options</title>
    <link rel="stylesheet" href="./styles.scss" media="screen" />
  </head>
  <body>
    <header>
      <h1>
        <img class="logo" src="../images/icon.png" alt="Extension icon" width="72px" />
        <br />
        Sass Content Options
      </h1>
      <p>
        Learn more in the
        <a href="https://extension.js.org" target="_blank" rel="noopener noreferrer"
          >Extension.js docs</a
        >.
      </p>
    </header>
    <main>
      <p class="banner">
        The edge the badge sits on is the setting below, saved here and read
        back by the content script. This page is styled by the same Sass
        pipeline the badge uses.
      </p>
      <label class="setting" for="badge-left">
        <input type="checkbox" id="badge-left" />
        Show the badge on the left
      </label>
      <p id="status" class="status" role="status">Loading your setting...</p>
    </main>
  </body>
  <script src="./scripts.js"></script>
</html>
