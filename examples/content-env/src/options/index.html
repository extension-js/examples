<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>.env Content Options</title>
    <link rel="stylesheet" href="./styles.css" media="screen" />
  </head>
  <body>
    <header>
      <h1>
        <img class="logo" src="../images/icon.png" alt="Extension icon" width="72px" />
        <br />
        .env Content Options
      </h1>
      <p>
        Learn more in the
        <a href="https://extension.js.org" target="_blank" rel="noopener noreferrer"
          >Extension.js docs</a
        >.
      </p>
    </header>
    <main>
      <p class="banner">
        The panel this extension injects into every page is the setting below,
        saved here and read back by the content script.
      </p>
      <label class="setting" for="show-badge">
        <input type="checkbox" id="show-badge" />
        Show the panel on web pages
      </label>
      <p id="status" class="status" role="status">Loading your setting...</p>
      <p id="build" class="build">Reading the build environment...</p>
    </main>
  </body>
  <script src="./scripts.ts"></script>
</html>
