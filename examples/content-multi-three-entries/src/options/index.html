<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multiple Entries Options</title>
    <link rel="stylesheet" href="./styles.css" media="screen" />
  </head>
  <body>
    <header>
      <h1>
        <img class="logo" src="../images/icon.png" alt="Extension icon" width="72px" />
        <br />
        Multiple Entries Options
      </h1>
      <p>
        Learn more in the
        <a href="https://extension.js.org" target="_blank" rel="noopener noreferrer"
          >Extension.js docs</a
        >.
      </p>
    </header>
    <main>
      <p class="banner">
        The four elements come from three content_scripts entries. The setting
        below controls the first one, saved here and read back by that script.
      </p>
      <label class="setting" for="show-badge">
        <input type="checkbox" id="show-badge" />
        Show Content Template #1 on web pages
      </label>
      <p id="status" class="status" role="status">Loading your setting...</p>
    </main>
  </body>
  <script src="./scripts.js"></script>
</html>
